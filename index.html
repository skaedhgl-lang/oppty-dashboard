 "texts": {
  "intro_480": "전기전자 분야 변리사입니다(2023년 합격, 실무 3년차). 전자·AI·통신·반도체 발명을 특허로 만들고, 미국·유럽·중국·일본·인도 해외출원을 담당하며 기업의 기술이 권리로 보호되는 과정을 현장에서 다루고 있습니다. 기술을 법의 언어로 옮기는 일은 결국 \"이 기술이 사회에서 어떤 가치를 갖는가\"를 묻는 일이라 생각합니다. 그래서 정책이 산업 현장과 어긋나는 지점, 청년 창업자가 지식재산 제도를 몰라 겪는 손해를 자주 봅니다. 청년 세대이자 기술·법률 전문가로서 그 간극을 메우는 목소리를 내고 싶습니다. 회의에서는 결론을 숫자와 조문으로 뒷받침하는 편이고, 다른 분야 전문가의 말을 끝까지 듣고 쟁점을 정리하는 역할을 잘합니다. 앞으로는 특허 실무에 머물지 않고 기술 정책 자문, 심사·평가, 강연으로 활동 폭을 넓혀 \"현장을 아는 젊은 전문가\"로 기여하고자 합니다. 서울에 거주하며 평일 회의 참석이 가능합니다.",
  "plan_280": "위원으로 참여하게 되면 세 가지를 하겠습니다. 첫째, 기술·지식재산 관련 안건에서 특허 실무자의 시각으로 실행 가능성을 검토하고 대안을 제시하겠습니다. 둘째, AI·반도체·통신 등 전기전자 분야 정책이 청년 창업자와 연구자에게 미치는 영향을 사례로 정리해 공유하겠습니다. 셋째, 회의 내용을 쉬운 말로 풀어 또래 청년에게 전달하는 가교 역할을 하겠습니다. 정해진 회의에 성실히 참석하고 사전 자료를 반드시 읽고 가겠습니다.",
  "evaluator_record": "변리사(2023년 합격) · 전기전자 분야 특허 출원·중간사건 실무 3년차 · 국내 출원 약 [  ]건, 해외출원(US·EP·CN·JP·IN) 약 [  ]건 · 기술 분야: 반도체 소자·공정, 5G/6G 통신 표준, AI·딥러닝 모델, 디스플레이·전력전자 · 선행기술조사·특허성 판단·권리범위 분석 수행 · 심사가능 분야: 전기전자, 정보통신, 인공지능, 반도체, 지식재산 일반",
  "strengths": [
   "전기전자·AI·통신·반도체 기술을 특허 명세서로 써 본 실무 경험 — 기술 안건을 빠르게 이해합니다.",
   "미국·유럽·중국·일본·인도 해외출원 경험 — 해외 제도와 비교해 우리 정책의 위치를 설명할 수 있습니다.",
   "법률 문서를 쉬운 말로 바꾸는 훈련 — 회의 결과를 청년 눈높이로 전달할 수 있습니다."
  ],
  "lecture_topics": [
   "스타트업이 첫 특허를 낼 때 꼭 알아야 할 7가지 (출원 전 공개 금지, 비용, 해외출원 타이밍)",
   "AI 발명은 어떻게 특허가 되나 — 생성형 AI 시대의 지식재산",
   "반도체·통신 표준특허와 로열티의 세계",
   "변리사가 본 청년 창업자의 흔한 IP 실수"
  ]
 }
}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const CRIT=D.criteria, MAX=D.max_total, today=new Date(D.date);
const TABS=[['opp','지원 기회'],['job','구인공고'],['track','지원 트래커'],['pool','풀 등록'],['text','문안'],['site','사이트 상태']];
let tab='opp';
document.getElementById('date').textContent=D.date;
function allItems(k){return (D.sections[k]||[]).concat(D.extras[k]||[]);}
function dday(it){if(!it.deadline){return it.deadline_text&&/상시|수시/.test(it.deadline_text)?'상시':'마감 미확인';}
 const d=Math.round((new Date(it.deadline)-today)/864e5);return (d>0?'D-'+d:(d===0?'오늘 마감':'마감'))+' ('+it.deadline+')';}
function imminent(it){if(!it.deadline)return false;const d=Math.round((new Date(it.deadline)-today)/864e5);return d>=0&&d<=7;}
function stats(){const o=allItems('opp'),j=allItems('job');const c=g=>o.filter(i=>i.fit===g).length;const T=D.tracker||[];const due=T.filter(r=>r.status==='준비중'&&r.deadline&&(new Date(r.deadline)-today)/864e5<=7&&(new Date(r.deadline)-today)>=0).length;
 document.getElementById('stats').innerHTML=`<div class="stat">지원 기회 <b>${o.length}</b>건 (상 ${c('상')} · 중 ${c('중')})</div><div class="stat">구인공고 <b>${j.length}</b>건 (상 ${j.filter(i=>i.fit==='상').length})</div><div class="stat">준비 중 <b>${T.filter(r=>r.status==='준비중').length}</b>건${due?` <span class="imminent">(임박 ${due})</span>`:''}</div><div class="stat">풀 등록 <b>${D.pools.filter(p=>p.registered).length}/${D.pools.length}</b>곳</div><div class="stat">사이트 ${D.site_status.filter(s=>s.ok).length}/${D.site_status.length}곳 확인</div>`;}
function tabs(){document.getElementById('tabs').innerHTML=TABS.map(([k,n])=>`<div class="tab ${k===tab?'on':''}" onclick="setTab('${k}')">${n}</div>`).join('');document.getElementById('filters').style.display=(tab==='opp'||tab==='job')?'flex':'none';}
function setTab(k){tab=k;try{localStorage.setItem('tab',k)}catch(e){}tabs();render();}
function catOptions(){const s=new Set();['opp','job'].forEach(k=>allItems(k).forEach(i=>s.add(i.category)));const sel=document.getElementById('cat');[...s].sort().forEach(c=>{const o=document.createElement('option');o.textContent=c;sel.appendChild(o);});}
function card(it,rank){const bars=CRIT.map(([k,m])=>`<div class="bar"><label><span>${k}</span><span>${it.scores[k]||0}/${m}</span></label><div class="track"><div class="fill" style="width:${100*(it.scores[k]||0)/m}%"></div></div></div>`).join('');
 return `<div class="card"><div class="row"><div class="rank">${rank}위</div><span class="badge b${it.fit}">${it.total}/${MAX} ${it.fit}</span><div class="title"><a href="${it.url}" target="_blank" rel="noopener">${esc(it.title)}</a>
 <div class="meta"><span class="chip">${esc(it.category)}</span>${esc(it.org)} · 마감 <span class="dday ${imminent(it)?'imminent':''}">${dday(it)}${imminent(it)?' ⚠임박':''}</span>${it.posted?' · 게시 '+it.posted:''}</div></div></div>
 <div class="bars">${bars}</div><details><summary>이유 보기 — ${esc(it.reason)}</summary><ul class="why">${(it.rationale||[]).map(r=>`<li>${esc(r)}</li>`).join('')}</ul></details></div>`;}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function render(){const m=document.getElementById('main');if(tab==='pool')return renderPools(m);if(tab==='track')return renderTrack(m);if(tab==='text')return renderTexts(m);if(tab==='site')return renderSites(m);
 const g=document.getElementById('grade').value,c=document.getElementById('cat').value,q=document.getElementById('q').value.trim().toLowerCase();
 let items=allItems(tab).filter(i=>(!g||i.fit===g)&&(!c||i.category===c)&&(!q||(i.title+i.org).toLowerCase().includes(q)));
 items.sort((a,b)=>b.total-a.total||((a.deadline||'9')>(b.deadline||'9')?1:-1));
 document.getElementById('count').textContent=items.length+'건';
 m.innerHTML=items.length?items.map((it,i)=>card(it,i+1)).join(''):'<div class="empty">이번 주 해당 항목이 없습니다.</div>';}
function poolState(){try{return JSON.parse(localStorage.getItem('pools')||'{}')}catch(e){return {}}}
function savePool(name,field,val){const s=poolState();s[name]=s[name]||{};s[name][field]=val;try{localStorage.setItem('pools',JSON.stringify(s))}catch(e){}}
function renderPools(m){const st=poolState();const groups={A:'평가·심사위원 풀',B:'위원회·자문 인재DB',C:'강연·멘토 풀',D:'IP 전문가 풀'};const done=D.pools.filter(p=>p.registered).length;
 let html=`<div class="card"><b>진행 ${done}/${D.pools.length}</b> <div class="track" style="height:10px;margin-top:6px"><div class="fill" style="width:${D.pools.length?100*done/D.pools.length:0}%;height:100%"></div></div><div class="small" style="margin-top:6px">등록 완료 표시: 터미널에서 <code>python main.py pool done &lt;id&gt; "메모"</code> (✅로 바뀜). 준비물 체크는 이 브라우저에만 저장됩니다.</div></div>`;
 for(const g in groups){const rows=D.pools.filter(p=>p.group===g);if(!rows.length)continue;html+=`<h3>${groups[g]}</h3>`;
  rows.forEach(p=>{const s=st[p.id||p.name]||{};const needs=(p.needs||'').split(/,|→/).map(x=>x.trim()).filter(Boolean);
  html+=`<div class="card pool"><div style="font-size:22px">${p.registered?'✅':'⬜'}</div>
  <div style="flex:1"><div class="name"><span class="badge b${p.priority||'중'}">${p.priority||'중'}</span> ${esc(p.name)} <span class="chip">${esc(p.id||'')}</span><span class="chip">갱신 ${esc(p.update||'분기')}</span>${p.registered?`<span class="chip">등록 ${esc(p.done_date||'')}</span>`:''}</div>
  <div class="meta">${esc(p.why||'')}</div>${p.eligible?`<div class="meta">자격: ${esc(p.eligible)}</div>`:''}${p.steps?`<div class="meta">방법: ${esc(p.steps)}</div>`:''}
  ${needs.length?`<div class="meta">준비물 체크:</div>`+needs.map((n,i)=>`<label class="meta" style="display:block"><input type="checkbox" ${s['n'+i]?'checked':''} onchange="savePool('${esc(p.id||p.name)}','n${i}',this.checked)"> ${esc(n)}</label>`).join(''):''}
  ${p.url?`<div class="meta"><a href="${p.url}" target="_blank" rel="noopener">${p.url}</a></div>`:''}${p.memo?`<div class="meta">메모: ${esc(p.memo)}</div>`:''}</div></div>`;});}
 m.innerHTML=html||'<div class="empty">pools.yaml 에 등록할 곳이 없습니다.</div>';}
function renderTrack(m){const T=(D.tracker||[]).slice().sort((a,b)=>(a.deadline||'9')>(b.deadline||'9')?1:-1);const order=['준비중','제출완료','결과대기','합격','불합격','포기'];
 let html=`<div class="small">공고 준비: <code>python main.py prepare &lt;보고서 번호&gt;</code> → applications/ 폴더에 체크리스트·초안. 상태 변경: <code>python main.py track &lt;번호&gt; &lt;상태&gt;</code></div>`;
 order.forEach(stt=>{const rows=T.filter(r=>r.status===stt);if(!rows.length)return;html+=`<h3>${stt} (${rows.length})</h3>`;rows.forEach(r=>{const d=r.deadline?Math.round((new Date(r.deadline)-today)/864e5):null;const imm=d!==null&&d>=0&&d<=7;
  html+=`<div class="card"><div class="row"><div class="rank">#${r.id}</div><div class="title"><a href="${r.url}" target="_blank" rel="noopener">${esc(r.title)}</a><div class="meta">${esc(r.org)} · ${esc(r.category||'')} · 마감 <span class="dday ${imm?'imminent':''}">${r.deadline?`${r.deadline} (D-${d})`:'미확인'}${imm?' ⚠':''}</span> · 폴더 <code>${esc(r.folder||'')}</code>${r.memo?` · ${esc(r.memo)}`:''}</div></div></div></div>`;});});
 m.innerHTML=T.length?html:html+'<div class="empty">아직 준비 중인 지원이 없습니다.</div>';}
function copyText(id){const el=document.getElementById(id);navigator.clipboard&&navigator.clipboard.writeText(el.textContent).then(()=>{el.previousElementSibling.textContent='복사됨 ✓';setTimeout(()=>el.previousElementSibling.textContent='복사',1500);});}
function renderTexts(m){const T=D.texts||{};const blocks=[['intro_480','자기소개 (프로필·지원서 공용)'],['plan_280','활동 계획'],['evaluator_record','평가위원·전문가 풀용 경력·실적'],['strengths','강점 3가지'],['lecture_topics','강연 주제 후보']];
 let html='<div class="small">복사 버튼으로 붙여넣기. [ ] 빈칸은 본인 숫자로. 원본은 pools.yaml 의 texts, 청년인재DB용 전체 문안은 applications/profile_2030db.md</div>';
 blocks.forEach(([k,label])=>{if(!T[k])return;const v=Array.isArray(T[k])?T[k].map((s,i)=>`${i+1}. ${s}`).join('\n'):T[k];html+=`<div class="card"><div class="row" style="justify-content:space-between"><b>${label}</b><span class="small">${v.length}자</span></div><button class="tab" style="margin:6px 0" onclick="copyText('tx_${k}')">복사</button><pre id="tx_${k}" style="white-space:pre-wrap;font:inherit;margin:0">${esc(v)}</pre></div>`;});
 m.innerHTML=html;}
function renderSites(m){const S=D.site_status||[];let html=`<div class="small">${S.filter(s=>s.ok).length}/${S.length}곳 정상. 실패한 곳은 sites.yaml 선택자를 확인(README '사이트 추가·삭제').</div>`;
 S.forEach(s=>{html+=`<div class="card"><div class="row"><div>${s.ok?'✅':'❌'}</div><div class="title">${esc(s.name)}<div class="meta">${s.count||0}건 수집 · 새 후보 ${s.new||0}건${s.error?` · <span class="imminent">${esc(s.error)}</span>`:''}</div></div></div></div>`;});
 m.innerHTML=html;}
['grade','cat','q'].forEach(id=>document.getElementById(id).addEventListener('input',render));
try{tab=localStorage.getItem('tab')||'opp'}catch(e){}
stats();tabs();catOptions();render();
</script></body></html>
